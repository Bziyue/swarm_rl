[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "swarm-rl"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["psutil"]

[tool.setuptools.packages.find]
where = ["source"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
swarm_rl = ["assets/**/*.usd"]
